<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fallbacks in Education: secure exams and skills record</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;500&family=Roboto:wght@400;500&display=swap">
<style>
:root{--bg:#fbfaf7;--card:#fff;--tx:#1b2420;--mut:#5a6862;--bd:#dcd8cf;--ac:#ff6b35;--pri:#1d4d41;--ok:#14683f;--okb:#dff3e8;--wn:#7a5000;--wnb:#fdf0d2;--er:#a12a1b;--erb:#fbe3df;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2320;--tx:#ece9e2;--mut:#a3afa9;--bd:#33403b;--pri:#23765f;--ok:#7bd8a4;--okb:#173a2a;--wn:#f0c36a;--wnb:#3b2f12;--er:#ff9d8f;--erb:#3f1d19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2320;--tx:#ece9e2;--mut:#a3afa9;--bd:#33403b;--pri:#23765f;--ok:#7bd8a4;--okb:#173a2a;--wn:#f0c36a;--wnb:#3b2f12;--er:#ff9d8f;--erb:#3f1d19;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 16px 0}
.w{max-width:860px;margin:0 auto}
h1,h2{font-family:Raleway,Roboto,system-ui,sans-serif;font-weight:300;margin:0}
h1{font-size:1.7rem;line-height:1.2}h2{font-size:1.35rem;margin-bottom:8px}
.sub{margin:2px 0 8px;color:var(--mut);font-size:.9rem}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font:inherit;color:var(--mut);cursor:pointer}
nav button[aria-current=page]{color:var(--tx);border-color:var(--ac);font-weight:500}
nav button:disabled{opacity:.5;cursor:not-allowed}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:0 0 14px}
p{margin:0 0 8px}.mut{color:var(--mut);font-size:.92rem}.msg{margin-top:8px;font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.b,.g{font:inherit;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--pri)}
.b{background:var(--pri);color:#fff}.g{background:none;color:var(--tx);border-color:var(--bd)}
input[type=text],select{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);max-width:100%}
:is(button,input,select):focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.82rem;background:var(--bd);color:var(--tx)}
.verified{background:var(--okb);color:var(--ok)}.review{background:var(--wnb);color:var(--wn)}.invalid{background:var(--erb);color:var(--er)}
fieldset{min-width:0;border:1px solid var(--bd);border-radius:10px;margin:0 0 10px;padding:10px 12px}
legend{font-weight:500;padding:0 6px}
label{display:block;padding:4px 0;cursor:pointer}
.bar{height:12px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.rec{border-top:1px solid var(--bd);padding:10px 0}
.code{display:inline-block;font:500 1.05rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;border:1px dashed var(--ac);border-radius:6px;padding:2px 10px}
</style></head>
<body>
<header><div class="w"><h1>Fallbacks in Education</h1><p class="sub">Secure exams, practical skills tests, and a record employers can trust.</p><nav id="nav" aria-label="Sections"></nav></div></header>
<main class="w" id="app"></main>
<script>
const KEY="fallbacks-prototype-v1",$=s=>document.querySelector(s),
esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),
nm=s=>String(s||"").trim().toLowerCase(),
fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0"),
shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
rid=n=>(Math.random().toString(36)+"000000").slice(2,2+n).toUpperCase();
const BANK={
Electronics:[
["Which unit measures electrical resistance?","Ohm","Volt","Ampere","Watt"],
["In a series circuit, the current through each component is…","The same","Halved","Zero","Doubled"],
["Which component stores electric charge?","Capacitor","Resistor","Diode","Fuse"],
["What is a fuse used for?","Protecting a circuit from too much current","Raising the voltage","Storing energy","Changing AC to DC"],
["Using Ohm’s law, what current flows when 12 V is applied across 4 Ω?","3 A","48 A","0.33 A","8 A"]],
ICT:[
["Which of these is the strongest password?","r7!Kq#29vLm@","password123","Nairobi2020","qwerty"],
["What does a phishing email try to do?","Trick you into giving away private information","Speed up your computer","Back up your files","Update your software"],
["Which file type is normally used for a spreadsheet?",".xlsx",".mp3",".png",".exe"],
["What does a computer’s RAM do?","Holds data that is in use right now","Stores files permanently","Connects to Wi-Fi","Cools the processor"],
["What does a firewall protect against?","Unauthorized access to a network","Power cuts","Dust","Slow typing"]],
Numeracy:[
["What is 15% of KES 2,000?","KES 300","KES 150","KES 200","KES 30"],
["A learner scores 36 out of 45. What percentage is that?","80%","75%","85%","90%"],
["If 3 pens cost KES 90, how much do 5 pens cost?","KES 150","KES 120","KES 180","KES 450"],
["What is the area of a rectangle that is 8 m by 5 m?","40 m²","26 m²","13 m²","80 m²"],
["Simplify 3/12.","1/4","1/3","3/4","1/2"]]};
const SK={
"Soldering and circuit assembly":["Follows safety steps (eye protection, ventilation)","Makes clean, shiny solder joints","Places components with the right polarity","Circuit powers on and works as designed","Cleans and stores tools"],
"Network cabling":["Names the cable standard being used","Crimps the connector correctly","Passes the continuity test","Labels both cable ends","Records the test result"],
"Spreadsheet task":["Enters the data accurately","Uses formulas such as SUM and AVERAGE","Formats a clear table","Builds a readable chart","Saves with a clear file name"]};
const LAB={verified:"Verified",review:"Under review",invalid:"Invalidated",fail:"Not passed"};
function seed(){const F=(t,n)=>({id:n,date:"2026-09-1"+n+"T09:00:00Z",flags:[],...t});
return{tab:"home",name:"",last:null,did:{},recs:[
F({name:"Amani Wanjiru",kind:"Exam",title:"Electronics",score:4,total:4,status:"verified",code:"FB-AMANI1"},1),
F({name:"Amani Wanjiru",kind:"Practical",title:"Soldering and circuit assembly",score:5,total:5,status:"verified",code:"FB-SOLD01"},2),
F({name:"Brian Otieno",kind:"Exam",title:"ICT",score:2,total:4,status:"fail",code:""},3),
F({name:"Zawadi Kamau",kind:"Exam",title:"Numeracy",score:3,total:4,status:"review",code:"FB-REVW01",flags:["Left the exam tab","Left the exam tab","Paste attempt blocked"]},4)]}}
function load(){try{const j=localStorage.getItem(KEY);if(j){const o=JSON.parse(j);if(o&&Array.isArray(o.recs)){o.did=o.did||{};return o}}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),E=null,T=null;
const nid=()=>Math.max(0,...S.recs.map(r=>r.id))+1;
function code(){let c;do{c="FB-"+rid(6)}while(S.recs.some(r=>r.code===c));return c}

const recHtml=r=>`<div class="rec"><div class="row"><b>${esc(r.title)}</b><span class="chip">${r.kind}</span><span class="chip ${r.status}">${LAB[r.status]}</span></div><div class="mut">${r.score} of ${r.total} correct or met · ${new Date(r.date).toLocaleDateString()}${r.flags.length?` · ${r.flags.length} integrity flag${r.flags.length>1?"s":""}`:""}</div>${r.code?`<div style="margin-top:6px">Code <span class="code">${r.code}</span></div>`:""}</div>`;
function recBox(){if(!S.name)return'<p class="mut">Enter your name above to see your record. Try “Amani Wanjiru” for a sample.</p>';
const m=S.recs.filter(r=>nm(r.name)===nm(S.name));
return m.length?m.map(recHtml).join(""):'<p class="mut">No records yet for this name. Take an exam, or ask a school assessor to record a practical.</p>'}
const pcrit=k=>SK[k].map((c,i)=>`<label><input type="checkbox" data-c="${i}"> ${esc(c)}</label>`).join("");

function vHome(){const d=S.did,st=[
["exam","Take a secure exam","As a learner, sit a randomized paper that is monitored for irregularities.","learner","Open Learner"],
["school","Review integrity and skills gaps","As a school, see flagged exams and where learners are falling behind.","school","Open School"],
["prac","Record a practical skill","An assessor ticks off an employer-informed checklist as evidence of real ability.","school","Open School"],
["verify","Verify a skills record","As an employer, check a learner’s code and see trusted proof.","employer","Open Employer"]];
return`<div class="card"><h2>Proof of competency, not just a score</h2><p class="mut">This prototype follows the pitch: secure digital exams, practical skills tests, and a portable skills record. Work through the four steps below in order. Everything is saved in your browser only, and sample records are included so each screen has something to show.</p></div><div class="card">${st.map((s,i)=>`<div class="rec row"><span class="chip ${d[s[0]]?"verified":""}">${d[s[0]]?"Done":i+1}</span><div style="flex:1;min-width:200px"><b>${s[1]}</b><div class="mut">${s[2]}</div></div><button class="g" data-act="tab" data-v="${s[3]}">${s[4]}</button></div>`).join("")}</div>`}

function vResult(r){const f=r.status==="fail";
return`<div class="card"><h2>Result: ${r.score} of ${r.total}, ${f?"not passed yet":"passed"}</h2><p>${f?"Early support: revisit the questions marked for review, then take a fresh paper.":r.status==="review"?"Your credential is held until the school completes an integrity review.":"Your credential is verified. Share the code with an employer."}</p>${r.code?`<p>Verification code <span class="code">${r.code}</span></p>`:""}${r.fb.map(x=>`<div class="rec"><span class="chip ${x.ok?"verified":"invalid"}">${x.ok?"Correct":"Review"}</span> ${esc(x.q)}${x.ok?"":`<div class="mut">Correct answer: ${esc(x.a)}</div>`}</div>`).join("")}</div>`}

function vExam(){return`<div class="card"><div class="row"><b>Paper ${E.id}</b><span class="chip">${esc(E.topic)}</span><span class="chip" id="tm" style="margin-left:auto">${fmt(E.left)}</span></div><p class="mut">Secure mode is on. Leaving this tab, copying, pasting and right-clicking are logged. Choose one answer for each question.</p>${E.qs.map((q,i)=>`<fieldset><legend>${i+1}. ${esc(q.q)}</legend>${q.o.map((o,j)=>`<label><input type="radio" name="q${i}" data-q="${i}" value="${j}"${E.ans[i]===j?" checked":""}> ${esc(o.t)}</label>`).join("")}</fieldset>`).join("")}<div id="fl" class="msg"></div><div class="row" style="margin-top:8px"><button class="b" data-act="submit">Submit exam</button><button class="g" data-act="sim">Demo: simulate a tab switch</button></div></div>`}

function vLearner(){if(E)return vExam();const L=S.last&&S.recs.find(r=>r.id===S.last);
return`<div class="card"><h2>Take a secure exam</h2><p class="mut">Every learner gets a different randomized paper of four questions. The demo timer is 2 minutes.</p><div class="row"><input id="nm" type="text" placeholder="Your full name" value="${esc(S.name)}" maxlength="40" aria-label="Your full name"><select id="tp" aria-label="Subject">${Object.keys(BANK).map(k=>`<option>${k}</option>`).join("")}</select><button class="b" data-act="start">Start exam</button></div><div id="lmsg" class="msg"></div></div>${L&&L.fb?vResult(L):""}<div class="card"><h2>My skills record</h2><div id="rec">${recBox()}</div></div>`}

function vSchool(){const rv=S.recs.filter(r=>r.status==="review"),ex=S.recs.filter(r=>r.kind==="Exam");
const tops=Object.keys(BANK).map(t=>{const a=ex.filter(r=>r.title===t);return{t,n:a.length,p:a.length?Math.round(100*a.reduce((s,r)=>s+r.score/r.total,0)/a.length):0}}).filter(x=>x.n);
const low=tops.slice().sort((a,b)=>a.p-b.p)[0],names=[...new Set(S.recs.map(r=>r.name))];
return`<div class="card"><h2>Integrity monitor</h2>${rv.length?rv.map(r=>`<div class="rec"><b>${esc(r.name)}</b> · ${esc(r.title)} · ${r.score} of ${r.total}<div class="mut">${r.flags.map(f=>esc(f)).join("; ")}</div><div class="row" style="margin-top:6px"><button class="b" data-act="clear" data-id="${r.id}">Clear and verify</button><button class="g" data-act="inv" data-id="${r.id}">Invalidate</button></div></div>`).join(""):'<p class="mut">No exams are waiting for review. Exams with three or more flags appear here.</p>'}</div>
<div class="card"><h2>Skills gaps</h2><p class="mut">Averages are grouped by subject, so no learner is identified.</p>${tops.length?tops.map(x=>`<div class="rec"><div class="row"><b>${x.t}</b><span class="mut">${x.p}% average from ${x.n} exam${x.n>1?"s":""}</span></div><div class="bar"><i style="width:${x.p}%"></i></div></div>`).join("")+(tops.length>1?`<p class="msg">Biggest gap: <b>${low.t}</b>. Plan early support there before learners fail.</p>`:""):'<p class="mut">No exam data yet.</p>'}</div>
<div class="card"><h2>Record a practical skill</h2><p class="mut">Checklist built with employers. A learner needs 4 of 5 criteria to pass.</p><div class="row"><input id="pn" type="text" list="ln" placeholder="Learner name" maxlength="40" aria-label="Learner name"><datalist id="ln">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist><select id="ps" aria-label="Skill">${Object.keys(SK).map(k=>`<option>${esc(k)}</option>`).join("")}</select></div><div id="pc" style="margin:8px 0">${pcrit(Object.keys(SK)[0])}</div><button class="b" data-act="prac">Record result</button><div id="pmsg" class="msg"></div></div>
<button class="g" data-act="reset">Reset demo data</button>`}

const vEmployer=()=>`<div class="card"><h2>Verify a skills record</h2><p class="mut">Enter the code a learner shares with you. Use the sample code to see a verified record.</p><div class="row"><input id="vc" type="text" placeholder="FB-XXXXXX" maxlength="12" aria-label="Verification code" style="text-transform:uppercase"><button class="b" data-act="verify">Verify</button><button class="g" data-act="sample">Use sample code</button></div><div id="vr" class="msg"></div></div>`;

function render(){const tabs=[["home","How it works"],["learner","Learner"],["school","School"],["employer","Employer"]];
$("#nav").innerHTML=tabs.map(([k,l])=>`<button data-act="tab" data-v="${k}"${S.tab===k?' aria-current="page"':""}${E?" disabled":""}>${l}</button>`).join("");
$("#app").innerHTML=({home:vHome,learner:vLearner,school:vSchool,employer:vEmployer}[S.tab]||vHome)();if(E)flags()}
function go(t){if(E)return;S.tab=t;if(t==="school")S.did.school=true;save();render();window.scrollTo(0,0)}

function flags(){const n=E.flags.length,el=$("#fl");if(!el)return;
el.innerHTML=n?`<span class="chip ${n>=3?"review":""}">${n} integrity flag${n>1?"s":""}</span> Latest: ${esc(E.flags[n-1])}${n>=3?". This paper will be held for school review.":""}`:"No integrity flags yet."}
function flag(m){if(!E)return;E.flags.push(m);flags()}
function start(){const n=$("#nm").value.trim(),t=$("#tp").value;
if(!n){$("#lmsg").textContent="Enter your name to begin.";return}
S.name=n;S.last=null;S.tab="learner";
const qs=shuf(BANK[t]).slice(0,4).map(a=>({q:a[0],o:shuf([{t:a[1],ok:1},{t:a[2]},{t:a[3]},{t:a[4]}])}));
E={id:"P-"+rid(5),topic:t,qs,ans:[],flags:[],left:120,name:n};
clearInterval(T);T=setInterval(tick,1000);save();render();window.scrollTo(0,0)}
function tick(){if(!E){clearInterval(T);return}E.left--;const el=$("#tm");if(el)el.textContent=fmt(Math.max(E.left,0));if(E.left<=0)submit()}
function submit(){if(!E)return;clearInterval(T);
const fb=E.qs.map((q,i)=>({q:q.q,a:q.o.find(o=>o.ok).t,ok:!!(q.o[E.ans[i]]&&q.o[E.ans[i]].ok)}));
const score=fb.filter(x=>x.ok).length,total=fb.length,pass=score/total>=0.6,held=E.flags.length>=3;
const r={id:nid(),name:E.name,kind:"Exam",title:E.topic,score,total,status:pass?(held?"review":"verified"):"fail",code:pass?code():"",flags:E.flags.slice(),date:new Date().toISOString(),fb};
S.recs.push(r);S.last=r.id;S.did.exam=true;E=null;save();render();window.scrollTo(0,0)}
function prac(){const n=$("#pn").value.trim(),k=$("#ps").value,bx=[...document.querySelectorAll("#pc input")],ok=bx.filter(b=>b.checked).length;
if(!n){$("#pmsg").textContent="Enter the learner’s name first.";return}
const pass=ok>=4,r={id:nid(),name:n,kind:"Practical",title:k,score:ok,total:bx.length,status:pass?"verified":"fail",code:pass?code():"",flags:[],date:new Date().toISOString()};
S.recs.push(r);S.did.prac=true;save();render();
$("#pmsg").textContent=pass?`Recorded for ${n}: ${ok} of ${bx.length} criteria met. Verification code ${r.code}.`:`Recorded for ${n}: ${ok} of ${bx.length} criteria met, so not yet competent. No code issued.`}
function setSt(id,s){const r=S.recs.find(x=>x.id===id);if(r){r.status=s;save();render()}}
function verify(){const c=$("#vc").value.trim().toUpperCase(),o=$("#vr");
if(!c){o.textContent="Enter a code to check.";return}
const r=S.recs.find(x=>x.code===c);
if(!r){o.innerHTML='<div class="card"><span class="chip invalid">Not found</span> No record matches that code. Check it for typing errors.</div>';return}
const m={verified:["Verified","The school’s integrity checks passed."],review:["Pending review","This record is held for a school integrity review. Do not rely on it yet."],invalid:["Invalidated","The school invalidated this record after an integrity review."]}[r.status]||["Not valid",""];
if(r.status==="verified"){S.did.verify=true;save()}
o.innerHTML=`<div class="card"><span class="chip ${r.status}">${m[0]}</span><h2 style="margin-top:8px">${esc(r.name)}</h2><p>${esc(r.title)}, ${r.kind.toLowerCase()}, ${r.score} of ${r.total}<br>Issued ${new Date(r.date).toLocaleDateString()} with ${r.flags.length} integrity flag${r.flags.length===1?"":"s"}</p><p class="mut">${m[1]}</p></div>`}
function sample(){const r=S.recs.find(x=>x.status==="verified"&&x.code);$("#vc").value=r?r.code:"";verify()}
function reset(){clearInterval(T);E=null;S=seed();S.tab="school";save();render()}

document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
const a=b.dataset.act,id=+b.dataset.id;if(a==="tab")return go(b.dataset.v);
({start,submit,verify,sample,prac,reset,sim:()=>flag("Left the exam tab (simulated)"),clear:()=>setSt(id,"verified"),inv:()=>setSt(id,"invalid")})[a]()});
document.addEventListener("change",e=>{const t=e.target;if(E&&t.dataset&&t.dataset.q!==undefined)E.ans[+t.dataset.q]=+t.value;if(t.id==="ps")$("#pc").innerHTML=pcrit(t.value)});
document.addEventListener("input",e=>{if(e.target.id==="nm"){S.name=e.target.value.trim();save();const r=$("#rec");if(r)r.innerHTML=recBox()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="vc")verify()});
document.addEventListener("visibilitychange",()=>{if(E&&document.hidden)flag("Left the exam tab")});
["copy","cut","paste","contextmenu"].forEach(t=>document.addEventListener(t,e=>{if(E){e.preventDefault();flag(({copy:"Copy",cut:"Cut",paste:"Paste",contextmenu:"Right-click"})[t]+" attempt blocked")}}));
render();
</script></body></html>
